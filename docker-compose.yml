# kotharlabs.com — contêiner próprio (nginx sem privilégios, porta 8080 só interna).
# Em produção quem builda e roteia é o Coolify (usa o Dockerfile; ver DEPLOY.md).
# Este compose serve para teste local e para subir sem Coolify.
# O formulário de contato fala com o contato-api pela rede interna (nada de porta publicada).
# Medição de visitas (Umami + Postgres próprio): sem cookies, sem terceiros. Redes internas, nada publicado.
#   medicao: site (nginx) ↔ umami      banco: umami ↔ postgres (sem saída para fora)
services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    networks: [medicao, banco]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  umami-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks: [banco]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  contato-api:
    image: contato-api:local
    build: ./contato-api
    restart: unless-stopped
    expose:
      - "3000"
    # segredos só por variável de ambiente (.env fora do git ou painel do Coolify): ver contato-api/.env.example
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_TO: ${MAIL_TO:-contato@kotharlabs.com}
      MAIL_FROM: ${MAIL_FROM}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kotharlabs:
    image: kotharlabs:local
    build:
      context: .
      args:
        # id do site criado no painel do Umami (público, vai no HTML); vazio = sem medição
        PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    networks: [default, medicao]
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  umami-db-data:

networks:
  medicao:
    internal: true
  banco:
    internal: true

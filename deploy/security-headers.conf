# Cabeçalhos de segurança. Incluído em cada location porque add_header num location
# anula os herdados do server. HSTS fica no proxy da VPS (é ele quem fala HTTPS).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# CSP gerado no build (hash do <style> inline): scripts/gen-csp.mjs
include /etc/nginx/snippets/csp.conf;

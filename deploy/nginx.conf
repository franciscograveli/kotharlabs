# kotharlabs.com — site estático servido por nginx sem privilégios (porta 8080).
# HTTPS, HSTS e www→apex ficam no proxy da VPS, fora deste contêiner.
# teto por visitante no endpoint de medição (chave = IP que o proxy escreve em X-Forwarded-For)
limit_req_zone $http_x_forwarded_for zone=medir:1m rate=60r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # redirecionamentos relativos: atrás do proxy a porta interna (8080) não pode vazar no Location
    absolute_redirect off;

    root /usr/share/nginx/html;
    autoindex off;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # healthcheck do contêiner
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # URLs limpas: / → index.html, /rota → rota.html; sem listagem de diretório.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        # o formulário carrega um token de tempo assinado: o nginx troca o comentário SSI do HTML
        # pela resposta de /api/contato/token. Se o contato-api estiver fora, o campo fica vazio.
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # /404 casaria com 404.html via $uri.html e devolveria 200 (soft-404)
    location = /404 {
        return 404;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # arquivos com hash no nome
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # fontes: nome estável, mas imutáveis. Trocou a fonte? Renomeie o arquivo.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ícones e imagem social: nome estável, podem mudar
    location ~* ^/(?:favicon/|favicon\.ico$|og-image\.png$) {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # o mime.types do nginx não conhece .webmanifest
    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # script de medição: nome estável, pode mudar
    location = /medir.js {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* ^/(?:robots\.txt|sitemap.*\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # formulário de contato → contêiner contato-api (rede interna do compose).
    # O nome é resolvido a cada requisição (resolver do Docker), então o site sobe mesmo com a API parada.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $contato_api http://contato-api:3000;
        client_max_body_size 16k;
        proxy_pass $contato_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # o proxy da VPS já escreve o IP do visitante aqui; repassa sem acrescentar o do nginx
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        error_page 502 503 504 = @api_fora;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API parada: fetch recebe JSON; formulário sem JS cai na página de erro (que traz o e-mail)
    location @api_fora {
        default_type application/json;
        if ($http_accept ~* "application/json") {
            return 503 '{"ok":false,"erro":"indisponivel"}';
        }
        return 303 /erro-envio;
    }

    # medição de visitas: só o POST de eventos chega ao Umami (rede interna "medicao").
    # O painel do Umami NÃO é exposto por este domínio. Com o Umami parado, responde 204 e o visitante nem percebe.
    location = /medir {
        limit_except POST { deny all; }
        limit_req zone=medir burst=20 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $umami http://umami:3000;
        client_max_body_size 4k;
        proxy_pass $umami/api/send;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # a resposta do Umami traz CSP e CORS próprios: só valem os cabeçalhos deste site
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header Vary;
        proxy_hide_header Cache-Control;
        error_page 502 503 504 = @sem_medicao;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @sem_medicao {
        return 204;
    }
}
